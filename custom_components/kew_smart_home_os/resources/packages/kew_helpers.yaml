# Optional KEW helper package.
# Activate packages in configuration.yaml with:
# homeassistant:
#   packages: !include_dir_named packages

input_boolean:
  kew_guest_mode:
    name: KEW Gästemodus
    icon: mdi:account-group
  kew_night_mode:
    name: KEW Nachtmodus
    icon: mdi:weather-night
  kew_pool_mode:
    name: KEW Poolbetrieb
    icon: mdi:pool

input_select:
  kew_house_mode:
    name: KEW Hausmodus
    options:
      - Zuhause
      - Abwesend
      - Nacht
      - Urlaub
    initial: Zuhause
    icon: mdi:home-switch
