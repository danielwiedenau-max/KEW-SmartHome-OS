title: KEW Smart Home OS
views:
  - title: Home
    path: home
    icon: mdi:home-variant
    type: sections
    max_columns: 4
    sections:
      - type: grid
        cards:
          - type: heading
            heading: KEW Smart Home OS
            icon: mdi:chip
          - type: markdown
            content: |
              # Willkommen zuhause
              Dein Smart Home im KEW Premium Design.
          - type: tile
            entity: person.daniel
            name: Anwesenheit
            icon: mdi:account
          - type: weather-forecast
            entity: weather.home
            show_forecast: true
            forecast_type: daily
      - type: grid
        cards:
          - type: heading
            heading: Schnellzugriff
            icon: mdi:gesture-tap-button
          - type: tile
            entity: input_select.kew_house_mode
          - type: tile
            entity: input_boolean.kew_night_mode
          - type: tile
            entity: input_boolean.kew_guest_mode

  - title: Energie
    path: energie
    icon: mdi:solar-power-variant
    type: sections
    sections:
      - type: grid
        cards:
          - type: heading
            heading: SENEC & Photovoltaik
            icon: mdi:solar-panel-large
          - type: gauge
            entity: sensor.senec_battery_state_of_charge
            name: Speicher
            min: 0
            max: 100
          - type: sensor
            entity: sensor.senec_house_power
            name: Hausverbrauch
            graph: line
          - type: sensor
            entity: sensor.senec_solar_generated_power
            name: PV-Leistung
            graph: line

  - title: Licht
    path: licht
    icon: mdi:lightbulb-group
    type: sections
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Shelly & Tuya
            icon: mdi:lightbulb-on
          - type: tile
            entity: light.wohnzimmer
          - type: tile
            entity: light.kueche
          - type: tile
            entity: light.garten

  - title: Sicherheit
    path: sicherheit
    icon: mdi:cctv
    type: sections
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Eufy Kameras
            icon: mdi:shield-home
          - type: picture-entity
            entity: camera.eingang
            camera_view: live
            name: Eingang
          - type: picture-entity
            entity: camera.garten
            camera_view: live
            name: Garten

  - title: Klima
    path: klima
    icon: mdi:heat-pump
    type: sections
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Wärmepumpe
            icon: mdi:heat-pump-outline
          - type: thermostat
            entity: climate.waermepumpe
          - type: sensor
            entity: sensor.waermepumpe_vorlauftemperatur
            graph: line

  - title: Pool
    path: pool
    icon: mdi:pool
    type: sections
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Poolsteuerung
            icon: mdi:pool-thermometer
          - type: tile
            entity: input_boolean.kew_pool_mode
          - type: sensor
            entity: sensor.pool_temperature
            graph: line
          - type: tile
            entity: switch.pool_pump

  - title: Netzwerk
    path: netzwerk
    icon: mdi:router-wireless
    type: sections
    sections:
      - type: grid
        cards:
          - type: heading
            heading: FRITZ!Box
            icon: mdi:router-network
          - type: entities
            entities:
              - entity: sensor.fritz_box_external_ip
              - entity: sensor.fritz_box_download_throughput
              - entity: sensor.fritz_box_upload_throughput

  - title: Statistik
    path: statistik
    icon: mdi:chart-box
    type: sections
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Statistiken
            icon: mdi:chart-line
          - type: history-graph
            hours_to_show: 24
            entities:
              - sensor.senec_house_power
              - sensor.senec_solar_generated_power
              - sensor.pool_temperature

  - title: Kalender
    path: kalender
    icon: mdi:calendar-month
    type: sections
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Termine
            icon: mdi:calendar-clock
          - type: calendar
            entities:
              - calendar.familie
