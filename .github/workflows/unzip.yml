name: KEW ZIP entpacken

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: ZIP entpacken
        run: |
          unzip -o KEW-SmartHome-OS-v2.0.0-alpha.1.zip -d extracted
          cp -R extracted/. .
          rm -rf extracted
          rm KEW-SmartHome-OS-v2.0.0-alpha.1.zip

      - name: Dateien speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "KEW Smart Home OS v2.0.0-alpha.1 entpacken" || exit 0
          git push
