name: KEW ZIP automatisch entpacken

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/entpacken.yml"

permissions:
  contents: write

jobs:
  entpacken:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: KEW Smart Home OS entpacken
        run: |
          ZIP="KEW-SmartHome-OS-v1.0.0.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ZIP-Datei wurde nicht gefunden."
            exit 1
          fi

          rm -rf /tmp/kew
          mkdir -p /tmp/kew

          unzip -q "$ZIP" -d /tmp/kew

          rsync -av \
            --exclude=".github" \
            /tmp/kew/KEW-SmartHome-OS/ ./

          rm -f "$ZIP"

      - name: Dateien speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "KEW Smart Home OS automatisch entpackt"
          git push
